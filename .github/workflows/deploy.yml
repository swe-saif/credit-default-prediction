# Continuous deployment: after CI succeeds on main, publish the Angular app to GitHub Pages.
# GitHub Pages serves static files only, so the deployed site shows the form but cannot run the Flask model.
name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false  # never interrupt a deployment half-way

jobs:
  deploy:
    # Only deploy commits pushed to main whose CI run passed (or a manual run).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}  # exactly the commit CI tested

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build for production
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"
        working-directory: frontend

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist/frontend/browser

      - id: deployment
        uses: actions/deploy-pages@v5
