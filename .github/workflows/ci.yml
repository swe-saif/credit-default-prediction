# Continuous integration: test the Flask API and build the Angular app on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Flask API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'  # same version the model bundle was saved with
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q backend credit_risk

      - name: Run API tests (structure + model-backed API tests)
        run: python -m pytest -v

  frontend:
    name: Frontend (Angular build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx ng test --watch=false

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: angular-build
          path: frontend/dist/
